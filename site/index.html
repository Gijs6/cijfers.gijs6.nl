<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Cijferberekenaar</title>
        <meta name="description" content="Cijfers berekenen gegeven een N-term" />

        <link rel="stylesheet" href="/main.min.css" />
    </head>
    <body>
        <main>
            <h1><a href="/">Cijferberekenaar</a></h1>

            <nav>
                <a href="/" aria-current="page">N-term tabel</a>
                <a href="/cijfer">Cijfer berekenen</a>
            </nav>

            <div class="layout">
                <form id="form" class="inputs">
                    <div role="tablist" class="tabs">
                        <button type="button" role="tab" id="tab-single" aria-selected="true">Enkele N-term</button>
                        <button type="button" role="tab" id="tab-range" aria-selected="false">Meerdere N-termen</button>
                    </div>

                    <div class="field">
                        <label for="max">Max. aantal punten</label>
                        <input type="number" id="max" name="max" min="1" placeholder="bijv. 50" required />
                    </div>

                    <div id="panel-single">
                        <div class="field">
                            <label for="nterm">N-term</label>
                            <input type="number" id="nterm" name="nterm" value="1" step="0.1" />
                        </div>
                    </div>

                    <div id="panel-range" hidden>
                        <div class="field field--range">
                            <span class="label">N-term</span>
                            <div class="range-inputs">
                                <span>van</span>
                                <input type="number" id="nmin" name="nmin" value="0" step="0.1" />
                                <span>tot en met</span>
                                <input type="number" id="nmax" name="nmax" value="2" step="0.1" />
                            </div>
                        </div>
                    </div>

                    <button type="submit">Genereer tabel</button>
                </form>

                <section id="table-container" aria-live="polite"></section>
            </div>
        </main>

        <script src="app.js"></script>
    </body>
</html>
